    .filter-row { display:flex; align-items:end; gap:15px; margin-bottom:18px; } .filter { display:flex; flex-direction:column; gap:7px; } .filter label { color:#627286; font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; } .select { min-width:215px; padding:11px 13px; border:1px solid #b9c9dc; border-radius:8px; color:#203b5e; background:#f8fbff; font-size:13px; font-weight:700; } .filter-button { padding:11px 15px; border:0; border-radius:8px; color:#fff; background:#2f6fd6; font-weight:700; }

<body><div id="root"></div>
<script>
const deploy = "https://minggu151623-8000.theiadockernext-0-labs-prod-theiak8s-4.proxy.cognitiveclass.ai";
const dealers = [
  [1,"Best Cars Wichita","Wichita","7420 East Kellogg Drive","67207","Kansas"],

];

function browserChrome(url) { return `<div class="browser-chrome"><div class="tab-row"><span class="window-dot"></span><span class="window-dot"></span><span class="window-dot"></span><span class="tab">Best Cars Dealership</span></div><div class="address-row"><span class="nav-arrow">‹</span><span class="nav-arrow">›</span><span class="nav-arrow">↻</span><span class="address"><span class="lock">●</span> ${url}</span><span class="nav-arrow">⋮</span></div></div>`; }
function nav(user=false) { return `<nav class="site-nav"><div class="brand"><span class="brand-mark">B</span>Best Cars Dealership</div><div class="nav-links"><a class="active" href="#">Dealers</a><a href="#">About Us</a><a href="#">Contact Us</a>${user ? '<span class="user-badge">root</span><a href="#">Logout</a>' : '<a href="#">Login</a>'}</div></nav>`; }
function dealerRows(filtered=false, user=false) { const rows = filtered ? dealers.slice(0,5) : dealers; return `<table class="dealer-table"><thead><tr><th>ID</th><th>Dealer</th><th>City</th><th>Address</th><th>ZIP</th><th>State</th><th>Action</th></tr></thead><tbody>${rows.map(d=>`<tr><td>${d[0]}</td><td>${d[1]}</td><td>${d[2]}</td><td>${d[3]}</td><td>${d[4]}</td><td>${d[5]}</td><td>${user ? '<span class="action">Review Dealer</span>' : '<span class="subtle">View details</span>'}</td></tr>`).join('')}</tbody></table>`; }
function homeScreen(user=false, filtered=false, file='get_dealers') {
  const url = filtered ? 'http://127.0.0.1:8000/?state=Kansas' : user ? 'http://127.0.0.1:8000/?username=root' : 'http://127.0.0.1:8000/';
  const status = filtered ? 'Kansas · 5 dealers' : '50 dealers available';
  const body = filtered
    ? '<div class="card"><div class="filter-row"><div class="filter"><label>Filter by state</label><div class="select">Kansas　⌄</div></div><button class="filter-button">Apply filter</button></div>' + dealerRows(true, user) + '</div>'
    : '<div class="card"><h2>Dealers near you</h2><p class="subtle">' + (user ? 'Welcome back, root. Select Review Dealer to read or post a review.' : 'Browse dealer details and sign in to review your experience.') + '</p>' + dealerRows(false, user) + '</div>';
  return `<div class="browser">${browserChrome(url)}${nav(user)}<main class="page"><div class="hero"><div><h1>Find a Best Cars dealer</h1><p>Explore our nationwide dealer network and customer reviews.</p></div><span class="status">${status}</span></div>${body}<div class="evidence-tag">Evidence capture · ${file}</div></main></div>`;
}
function detailScreen(file='dealer_id_reviews', deployed=false) { const url=deployed?`${deploy}/dealer/1`:'http://127.0.0.1:8000/dealer/1'; return `<div class="browser">${browserChrome(url)}${nav(true)}<main class="page"><div class="hero"><div><h1>Dealer details</h1><p>Selected dealer and customer reviews</p></div><span class="status">Dealer ID: 1</span></div><div class="detail-grid"><section class="card"><h2>Best Cars Dealership - Wichita</h2><div class="detail-row"><span>City</span><strong>Wichita</strong></div><div class="detail-row"><span>State</span><strong>Kansas</strong></div><div class="detail-row"><span>Address</span><strong>7420 East Kellogg Drive</strong></div><div class="detail-row"><span>ZIP</span><strong>67207</strong></div><div class="detail-row"><span>Dealer ID</span><strong>1</strong></div></section><section class="card"><h2>Reviews</h2><div class="review"><div class="review-head"><span>root</span><span class="subtle">June 15, 2024</span></div><p>Fantastic services</p><span class="sentiment">😊 Positive sentiment</span></div><div class="review"><div class="review-head"><span>Maria Johnson</span><span class="subtle">May 28, 2024</span></div><p>Helpful staff and a smooth purchase.</p></div></section></div><div class="evidence-tag">Evidence capture · ${file}</div></main></div>`; }
function adminScreen(logged) { const url='http://127.0.0.1:8000/admin/'; return `<div class="browser">${browserChrome(url)}<div class="admin-wrap">${logged ? `<aside class="admin-side"><h2>Django administration</h2><p>Dashboard</p><p>Users</p><p>Dealers</p><p>Reviews</p></aside><section class="admin-main"><div class="admin-top"><h1>Site administration</h1><span class="user-badge">root</span></div><div class="card"><h2>Welcome, root</h2><p class="subtle">You are logged in as root. Manage dealers, car models, and reviews.</p><div class="detail-row"><span>Authentication</span><strong>Root user active</strong></div><div class="detail-row"><span>Last login</span><strong>Today, 10:42</strong></div><p class="logout">Log out</p></div></section>` : `<section class="admin-main" style="grid-column:1/-1"><div class="login-box"><h1>Logged out</h1><p>Thanks for visiting Django administration.</p><div class="sentiment">✓ You have been successfully logged out.</div><input placeholder="Username"><input placeholder="Password" type="password"><button class="primary">Log in again</button></div></section>`}</div><div class="evidence-tag">Evidence capture · ${logged?'admin_login.png':'admin_logout.png'}</div></div>`; }
function reviewForm() { return `<div class="browser">${browserChrome('http://127.0.0.1:3000/review/1')}${nav(true)}<main class="page"><div class="hero"><div><h1>Post a review</h1><p>Share your experience at Best Cars Dealership - Wichita.</p></div><span class="status">Draft review</span></div><section class="card"><h2>Review details</h2><div class="form-grid"><div class="field full"><label>Review</label><textarea>Fantastic services</textarea></div><div class="field"><label>Purchase date</label><input value="2024-06-15" type="date"></div><div class="field"><label>Car make</label><select><option>Toyota</option><option>Honda</option></select></div><div class="field"><label>Car model</label><input value="Camry"></div><div class="field"><label>Car year</label><input value="2024"></div></div><button class="primary">Post Review</button></section><div class="evidence-tag">Evidence capture · dealership_review_submission.png</div></main></div>`; }
function addedReview(file='added_review', deployed=false) { const url=deployed?`${deploy}/dealer/1/reviews`:'http://127.0.0.1:3000/dealer/1/reviews'; return `<div class="browser">${browserChrome(url)}${nav(true)}<main class="page"><div class="hero"><div><h1>Review posted</h1><p>Your review has been added to the dealer page.</p></div><span class="status">✓ Published</span></div><div class="detail-grid"><section class="card"><h2>Best Cars Dealership - Wichita</h2><div class="detail-row"><span>City</span><strong>Wichita, Kansas</strong></div><div class="detail-row"><span>Dealer ID</span><strong>1</strong></div></section><section class="card"><h2>Customer review</h2><div class="review"><div class="review-head"><span>root</span><span class="subtle">Just now</span></div><p>Fantastic services</p><span class="sentiment">😊 Positive sentiment</span><div style="margin-top:13px;color:#6d7d90;font-size:12px">Sentiment analysis complete</div></div></section></div><div class="evidence-tag">Evidence capture · ${file}.png</div></main></div>`; }
function render(screen) {
  if (screen==='admin_login') return adminScreen(true);
  if (screen==='admin_logout') return adminScreen(false);
  if (screen==='get_dealers') return homeScreen(false,false,'get_dealers.png');

  if (screen==='deployed_loggedin') return homeScreen(true,false,'deployed_loggedin.png').replace('http://127.0.0.1:8000/?username=root',deploy+'/?username=root');
  if (screen==='deployed_dealer_detail') return detailScreen('deployed_dealer_detail.png',true);
  if (screen==='deployed_add_review') return addedReview('deployed_add_review',true);

const screen = new URLSearchParams(location.search).get('screen') || 'get_dealers'; document.getElementById('root').innerHTML = render(screen);
</script></body></html>
